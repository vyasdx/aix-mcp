# Publishes to PyPI with trusted publishing (no API token stored here), then lists the
# release in the official MCP registry using GitHub OIDC (no secret either).
# One-time setup on pypi.org: add a pending trusted publisher for project "aix-mcp",
# owner vyasdx, repository aix-mcp, workflow release.yml, environment "pypi".
name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Tag, package and server.json versions must agree
        run: |
          tag="${GITHUB_REF_NAME#v}"
          pkg="$(python -c 'import re,pathlib; print(re.search(r"__version__ = \"(.+)\"", pathlib.Path("src/aix_mcp/__init__.py").read_text()).group(1))')"
          reg="$(python -c 'import json; d=json.load(open("server.json")); print(d["version"]); assert all(p["version"]==d["version"] for p in d["packages"])')"
          echo "tag=$tag package=$pkg server.json=$reg"
          test "$tag" = "$pkg" && test "$tag" = "$reg"
      - run: pip install build twine && python -m build && twine check --strict dist/*
      - name: Bundled collectors must have LF line endings (ksh on AIX breaks on CRLF)
        run: |
          python - <<'PY'
          import glob, zipfile
          z = zipfile.ZipFile(glob.glob("dist/*.whl")[0])
          names = [n for n in z.namelist() if n.startswith("aix_mcp/collectors/")]
          assert len(names) == 3, names
          bad = [n for n in names if b"\r" in z.read(n)]
          assert not bad, f"CRLF in {bad}"
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1

  mcp-registry:
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    env:
      MCP_PUBLISHER_VERSION: v1.8.1
    steps:
      - uses: actions/checkout@v4
      - name: Wait until PyPI serves this version
        run: |
          v="${GITHUB_REF_NAME#v}"
          for i in $(seq 1 30); do
            curl -fsS "https://pypi.org/pypi/aix-mcp/$v/json" >/dev/null && exit 0
            sleep 10
          done
          echo "aix-mcp $v not visible on PyPI after 5 minutes" >&2; exit 1
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: Download and verify mcp-publisher
        run: |
          set -euo pipefail
          archive="mcp-publisher_linux_amd64.tar.gz"
          base="https://github.com/modelcontextprotocol/registry/releases/download/${MCP_PUBLISHER_VERSION}"
          curl --fail --location --silent --show-error --output "$archive" "$base/$archive"
          curl --fail --location --silent --show-error --output "$archive.sigstore.json" "$base/$archive.sigstore.json"
          cosign verify-blob \
            --bundle "$archive.sigstore.json" \
            --certificate-identity "https://github.com/modelcontextprotocol/registry/.github/workflows/release.yml@refs/tags/${MCP_PUBLISHER_VERSION}" \
            --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
            "$archive"
          tar xzf "$archive" mcp-publisher
      - run: ./mcp-publisher login github-oidc
      - run: ./mcp-publisher publish
