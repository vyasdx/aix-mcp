<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256" role="img" aria-label="aix-mcp logo">
  <title>aix-mcp</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1220"/>
      <stop offset="1" stop-color="#12304a"/>
    </linearGradient>
  </defs>
  <rect width="256" height="256" rx="48" fill="url(#bg)"/>
  <!-- the frame -->
  <rect x="36" y="44" width="150" height="168" rx="20" fill="none" stroke="#2dd4bf" stroke-width="7"/>
  <!-- partitions, each with a health light -->
  <rect x="54" y="64" width="114" height="34" rx="8" fill="#16405e"/>
  <circle cx="152" cy="81" r="7" fill="#22c55e"/>
  <rect x="54" y="111" width="114" height="34" rx="8" fill="#16405e"/>
  <circle cx="152" cy="128" r="7" fill="#22c55e"/>
  <rect x="54" y="158" width="114" height="34" rx="8" fill="#16405e"/>
  <circle cx="152" cy="175" r="7" fill="#f59e0b"/>
  <!-- protocol link out of the frame -->
  <path d="M186 128 H206" stroke="#2dd4bf" stroke-width="7" stroke-linecap="round"/>
  <circle cx="218" cy="128" r="16" fill="#2dd4bf"/>
  <circle cx="218" cy="128" r="6" fill="#0b1220"/>
</svg>
