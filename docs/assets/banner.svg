<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 640" width="1280" height="640" role="img" aria-label="aix-mcp: read-only MCP server for the AIX guest OS">
  <title>aix-mcp: read-only MCP server for the AIX guest OS</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1220"/>
      <stop offset="1" stop-color="#12304a"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0 H0 V40" fill="none" stroke="#ffffff" stroke-opacity="0.04" stroke-width="1"/>
    </pattern>
    <style>
      .t { font-family: 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif; }
      .chip { fill: #12344f; stroke: #2dd4bf; stroke-opacity: 0.5; }
      .chiptext { fill: #ccfbf1; font-size: 24px; }
    </style>
  </defs>
  <rect width="1280" height="640" fill="url(#bg)"/>
  <rect width="1280" height="640" fill="url(#grid)"/>

  <!-- mark -->
  <g transform="translate(96 168) scale(1.2)">
    <rect x="0" y="0" width="200" height="224" rx="26" fill="none" stroke="#2dd4bf" stroke-width="8"/>
    <rect x="24" y="26" width="152" height="46" rx="10" fill="#16405e"/>
    <circle cx="154" cy="49" r="9" fill="#22c55e"/>
    <rect x="24" y="89" width="152" height="46" rx="10" fill="#16405e"/>
    <circle cx="154" cy="112" r="9" fill="#22c55e"/>
    <rect x="24" y="152" width="152" height="46" rx="10" fill="#16405e"/>
    <circle cx="154" cy="175" r="9" fill="#f59e0b"/>
    <path d="M200 112 H228" stroke="#2dd4bf" stroke-width="8" stroke-linecap="round"/>
    <circle cx="244" cy="112" r="20" fill="#2dd4bf"/>
    <circle cx="244" cy="112" r="8" fill="#0b1220"/>
  </g>

  <!-- words -->
  <text x="480" y="270" class="t" fill="#ffffff" font-size="104" font-weight="700" letter-spacing="-2">aix-mcp</text>
  <text x="484" y="328" class="t" fill="#9fb3c8" font-size="34">Read-only MCP server for the AIX guest OS</text>

  <g transform="translate(484 372)">
    <rect class="chip" x="0" y="0" width="150" height="44" rx="22"/>
    <text class="t chiptext" x="75" y="30" text-anchor="middle">multipath</text>
    <rect class="chip" x="164" y="0" width="150" height="44" rx="22"/>
    <text class="t chiptext" x="239" y="30" text-anchor="middle">FC / NPIV</text>
    <rect class="chip" x="328" y="0" width="100" height="44" rx="22"/>
    <text class="t chiptext" x="378" y="30" text-anchor="middle">VIOS</text>
    <rect class="chip" x="442" y="0" width="160" height="44" rx="22"/>
    <text class="t chiptext" x="522" y="30" text-anchor="middle">filesystems</text>
  </g>
  <g transform="translate(484 432)">
    <rect x="0" y="0" width="200" height="44" rx="22" fill="#2dd4bf"/>
    <text class="t" x="100" y="30" text-anchor="middle" fill="#0b1220" font-size="24" font-weight="700">read-only</text>
    <rect class="chip" x="214" y="0" width="230" height="44" rx="22"/>
    <text class="t chiptext" x="329" y="30" text-anchor="middle">no agent on AIX</text>
  </g>

  <text x="96" y="590" class="t" fill="#6b8299" font-size="22">Complements HMC-level MCP servers  ·  Apache-2.0  ·  Not affiliated with IBM</text>
</svg>
